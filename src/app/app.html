<mat-sidenav-container class="sidenav-container">
  
  
  <mat-sidenav #drawer mode="over" class="sidenav">
    <mat-toolbar color="primary">Menu</mat-toolbar>
    <div style="padding: 16px;">
      <p><a mat-button href="#">Domov</a></p>
      <p><a mat-button href="#">Recepty</a></p>
      <p><a mat-button href="#">Obľubene</a></p>
      <p><a mat-button href="#">O nás</a></p>
    </div>
  </mat-sidenav>

  
  <mat-sidenav-content>
    
    <mat-toolbar color="primary">
      
      <button mat-icon-button class="example-icon" (click)="drawer.toggle()" aria-label="Example icon-button with menu icon">
        <mat-icon>menu</mat-icon>
      </button>
      
      <span>Recepty</span>
      
      <span class="example-spacer"></span>
      
      <button mat-icon-button class="example-icon favorite-icon" routerLink="/login" aria-label="Example icon-button with heart icon">
        <mat-icon>login</mat-icon>
      </button>
      <button mat-icon-button class="example-icon" routerLink="/" aria-label="Domov">
  <mat-icon>home</mat-icon>
</button>
    </mat-toolbar>



 <router-outlet></router-outlet>

  </mat-sidenav-content>
</mat-sidenav-container>
