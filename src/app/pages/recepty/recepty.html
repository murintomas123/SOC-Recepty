<div class="page-container">
  <h2>Všetky recepty</h2>

  <!-- Mriežka vedľa seba -->
  <div class="grid-container">
    <div *ngFor="let item of receptyService.getRecepty()" class="card" (click)="otvorDetail(item)">
      <div class="card-header">
        <h3>{{ item.nazov }}</h3>
        <button class="heart-btn" [class.active]="item.oblubeny" (click)="prepniHeart($event, item.id)">
          ♥
        </button>
      </div>
      <p class="time">⏱ {{ item.casPripravy }} min</p>
      <p class="preview">{{ item.ingrediencie }}</p>
    </div>
  </div>

  <!-- Modal okno pre detail receptu -->
  <div class="modal" *ngIf="otvorenyRecept" (click)="zatvorDetail()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <span class="close-btn" (click)="zatvorDetail()">&times;</span>
      <h2>{{ otvorenyRecept.nazov }}</h2>
      <p><strong>Čas prípravy:</strong> {{ otvorenyRecept.casPripravy }} minút</p>
      <hr />
      <h4>Ingrediencie:</h4>
      <p class="text-block">{{ otvorenyRecept.ingrediencie }}</p>
      <h4>Postup:</h4>
      <p class="text-block">{{ otvorenyRecept.postup }}</p>
    </div>
  </div>
</div>
