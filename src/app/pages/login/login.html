<div class="login-container">
  <mat-card class="login-card mat-elevation-z4">
    <mat-card-header>
      <mat-card-title>Prihlásenie</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form class="login-form">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput placeholder="vas@email.sk" required>
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Heslo</mat-label>
          <input matInput type="password" required>
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width login-btn">
          Prihlásiť sa
        </button>
        
      </form>
    </mat-card-content>
  </mat-card>
</div>
